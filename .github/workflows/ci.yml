name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Lint, Build & Test on macOS and Linux ──────────────────────
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "macOS"
            runner: macos-15
            container: ""
            install-swiftlint: brew install swiftlint
          - name: "Linux"
            runner: ubuntu-latest
            container: swift:6.2
            install-swiftlint: |
              apt-get update && apt-get install -y curl unzip
              curl -fsSL "https://github.com/realm/SwiftLint/releases/download/0.63.2/swiftlint_linux_$(arch | sed 's/x86_64/amd64/;s/aarch64/arm64/').zip" -o swiftlint.zip
              unzip -o swiftlint.zip -d /usr/local/bin
              chmod +x /usr/local/bin/swiftlint
              rm swiftlint.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2+)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Install SwiftLint
        run: ${{ matrix.install-swiftlint }}

      - name: Lint
        run: swiftlint

      - name: Validate test module boundaries
        run: ./Tools/validate-test-boundaries.sh

      - name: Build
        env:
          DISABLE_SWIFTLINT: "1"
        run: swift build

      - name: Test
        env:
          DISABLE_SWIFTLINT: "1"
        run: swift test

  # ── DocC Documentation ───────────────────────────────────────
  # Building the docs is NOT optional-extra: it is the only check that the
  # reference still covers the whole package. The build asserts that pages
  # exist for types declared in the sibling modules, so the day someone
  # documents a single target again — which silently drops `View`, `Color`,
  # `Binding` and friends from the site — this job fails instead of the docs
  # quietly losing half their content. See Tools/BuildDocs/README.md.
  docs:
    name: Build DocC
    needs: build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Build DocC documentation
        env:
          DISABLE_SWIFTLINT: "1"
        run: ./Tools/BuildDocs/build-docs.sh --output docc-output --static-hosting

