# SwiftLint Configuration for TUIkit

# Only lint project sources (not build artifacts or dependencies)
included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm

# Rules
disabled_rules:
  # Both of these conflict with swift-format, which formats this project
  # (.swift-format sets multiElementCollectionTrailingCommas: true and
  # lineBreakBeforeEachArgument: true). Enabling either makes the two tools
  # rewrite each other's output on every save — measured at 450 and 161
  # sites respectively.
  - trailing_comma
  - opening_brace
  # A type's length isn't a meaningful quality signal here: cohesive
  # internal render cores (e.g. _ListCore) are clearer kept whole than
  # split across files purely to satisfy a line ceiling. `file_length`
  # (below) already bounds the same thing at the granularity this project
  # actually splits on, and it is enforced.
  - type_body_length

# Two levels of type nesting, not the default one: SwiftUI parity puts an
# enum inside a nested struct in several public types (OpenURLAction.Result
# .Disposition, TimelineView.Context.Cadence), and matching those signatures
# is non-negotiable. Three levels still warns, so the rule keeps its teeth —
# it was previously disabled outright.
nesting:
  type_level: 2

# NOT opted in, deliberately: `discouraged_none_name` flags 14 sites, all of
# them public `.none` API this framework mirrors from SwiftUI (BorderStyle,
# SymbolVariants, ScrollOverscroll, Scrollbar, TextCursorStyle, …). Renaming
# them would break the SwiftUI-parity rule, which outranks the lint.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - direct_return
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - missing_docs
  - modifier_order
  - non_overridable_class_declaration
  - operator_usage_whitespace
  - optional_enum_case_matching
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_swiftui_state
  - reduce_into
  - redundant_final
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - self_binding
  - shorthand_optional_binding
  - sorted_first_last
  - sorted_imports
  - static_operator
  - toggle_bool
  - unavailable_function
  - unhandled_throwing_task
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_whitespace_closing_braces
  - weak_delegate
  - yoda_condition

# Rule Configuration
# Every file opens with the same six-line banner, and this is what keeps it
# that way. The pattern pins four things and deliberately no more:
#
#   1. the banner, byte for byte — so `TUIKit`, a hyphen for the em dash, or a
#      dropped 🖥️ (or its variation selector) all fail;
#   2. line 2 is the file's OWN name, via SwiftLint's SWIFTLINT_CURRENT_FILENAME
#      token — this already caught two headers wearing another file's name;
#   3. an attribution line that is not Xcode's `Created by X on 1/1/25.`
#      boilerplate — any real name passes, so a new contributor needs no config
#      change;
#   4. `License: MIT`.
#
# It does NOT anchor the END of the header: SwiftLint's header region runs to
# the first declaration, so requiring the licence to be last reports 222 files
# whose description sits after it. `\r?\n` rather than `\n` because the
# Windows port is in progress and a CRLF working tree would otherwise fail
# every file with a message that explains nothing. (SwiftLint's own Windows
# build, new in 0.64, requires `\n` line endings in every file it lints, so a
# Windows lint lane would need an LF checkout whatever this pattern accepts.)
file_header:
  required_pattern: '\A//  🖥️ TUIkit — Terminal UI Kit for Swift\r?\n//  SWIFTLINT_CURRENT_FILENAME\r?\n//\r?\n(?:(?!//  License:)//[^\n]*\r?\n)*?//  Created by (?![^\n]* on \d)[^\n]+\r?\n//  License: MIT$'

# `invisible_character`, a default rule since SwiftLint 0.63.3, rejects a raw
# zero-width space (U+200B), zero-width non-joiner (U+200C) or U+FEFF inside a
# string literal. This project's literals are full of terminal-width cases, and
# a character that draws nothing is invisible in an editor and in a diff, so
# the ones a literal here has any use for are added: in a literal they must be
# spelled as `\u{…}` escapes, which a reviewer can see — as the width corpus
# (`bidi_lrm`, `bidi_rlm`) and `ScalarWidthFastPathTests` (U+202D, U+202C)
# already spell them. Escape one BY HAND: the rule autocorrects by DELETING the
# character, and a deleted control draws nothing either, so a width test built
# on one would go on passing without testing it. Never `--fix` this rule.
#   - the bidi controls behind "Trojan Source" (CVE-2021-42574): the
#     embeddings and overrides U+202A–202E and the isolates U+2066–2069;
#   - the direction marks U+200E, U+200F and U+061C;
#   - the word joiner and invisible operators U+2060–2064, and the soft hyphen
#     U+00AD.
# Deliberately NOT added: U+200D ZERO WIDTH JOINER and the tag characters
# U+E0020–E007F, which occur raw 96 and 6 times in string literals today, as the
# content of emoji-sequence and subdivision-flag literals (they read as the
# glyph they build), and the variation selectors, which change how a character
# looks.
# Every added code point measured 0 raw occurrences in Sources + Tests. The
# rule looks at string literals only; comments are not covered.
invisible_character:
  additional_code_points:
    - "00AD"
    - "061C"
    - "200E"
    - "200F"
    - "202A"
    - "202B"
    - "202C"
    - "202D"
    - "202E"
    - "2060"
    - "2061"
    - "2062"
    - "2063"
    - "2064"
    - "2066"
    - "2067"
    - "2068"
    - "2069"

# `redundant_final` (enabled 2026-09-28) and this rule disagree about a `class`
# member of a final class: this one asked for `final class func`, which that
# one then reports as redundant, and `swiftlint --fix` swapped one pair of
# errors for the other on every run. `static_over_final_class` rejects both
# spellings anyway; asking for `static` is the one answer all three accept.
non_overridable_class_declaration:
  final_class_modifier: static

line_length:
  warning: 160
  error: 200
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 600
  error: 1200
  ignore_comment_only_lines: true

function_body_length:
  # The 250-line error ceiling lets the bundled-palette registry in
  # `PalettePreset.swift` stay a single linear list — splitting it just
  # to satisfy the linter would scatter related data across helpers.
  warning: 100
  error: 250

function_parameter_count:
  warning: 8
  error: 12

cyclomatic_complexity:
  warning: 15
  error: 30

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    # (`id` / `to` need no entry: min_length warns only below 2 characters, so
    #  two-letter names already pass.)
    # The example app's terse localized-string lookup, `L("key")` — a deliberate
    # one-letter helper (à la gettext's `_`) kept short because it wraps almost
    # every user-facing string. `Lf("key", args...)` is its formatting sibling
    # (positional `{0}` substitution) used by the stress harness; both read as
    # proper nouns, so the leading-capital convention is intentional.
    - L
    - Lf
    # Framework-private View / ViewModifier witnesses, `_`-prefixed following
    # the SwiftUI convention (as the `_`-prefixed types in
    # `type_name.excluded` are). They let the child-layout path detect Spacer
    # / z-index wrappers per type instead of with a speculative runtime
    # conformance cast, and let a modifier answer for the ModifiedView around
    # it, which a conditional conformance cannot witness.
    - _isSpacer
    - _providesZIndex
    - _providesAlignmentGuide
    - _isAnimatable
    - _animated
    - _modify
    - _renderSelf
    - _measureSelf
    - _explicitIDKey
    - _valueIsBoxed
    # Idiomatic single-letter math / graphics / loop names: keeping
    # them short matches the surrounding domain (coordinates,
    # colour channels, dimensions, indices) better than renaming.
    - a
    - b
    - c
    - d
    - g
    - h
    - i
    - j
    - k
    - m
    - n
    - p
    - q
    - r
    - s
    - t
    - v
    - w
    - x
    - y
    - z

large_tuple:
  warning: 6
  error: 12

type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 50
    error: 60
  # `_`-prefixed types are this project's SwiftUI-style convention for
  # internal cores and modifier-created helpers (_ListCore, _ZIndexView,
  # _MemoizedRow, …). SwiftLint already permits the underscore on PRIVATE
  # declarations; these are internal or public-but-underscored, so they used
  # to need enumerating — ~90 entries, each with a comment restating what the
  # type's own doc already said, and four types whose authors reached for an
  # inline `swiftlint:disable:this type_name` instead, which the list could
  # not see. One symbol allowance replaces all of it and makes the policy
  # uniform. Length limits still apply.
  allowed_symbols: ["_"]
  excluded:
    # Two characters, so below `min_length`; the conventional Swift spelling.
    - ID

custom_rules:
  # `ColorDepth.processCurrent` is a lazy static whose initializer is
  # `ColorDepth.detect()`, so the first read of `ColorDepth.current` ANYWHERE in
  # the process fixes the colour depth for the rest of the run — and `current`
  # is the default argument of `Color.foregroundCodes(depth:)`,
  # `backgroundCodes(depth:)` and `backgroundEscape(depth:)`, so that reader is
  # simply the first code to spell any colour. swift-testing runs suites
  # concurrently inside one process, so a test that put a fake `TERM` in the
  # real environment — even briefly, even restoring it — could latch every
  # other test's colours at `dumb` or `basic16`; 70 test files assert on
  # `38;2;` / `38;5;` byte sequences that would then silently change.
  #
  # The decision table is posed on a dictionary instead
  # (`ColorDepth.detect(environment:)`, the shape the TerminalHost,
  # LocalizationService and TerminalColorQuery environment readers already
  # use), which leaves no fake value for the latch to catch. This rule is what
  # makes that structural rather than a convention: before it, the only thing
  # standing between the suite and the hazard was one hand-written
  # `_ = ColorDepth.current` in one test file.
  #
  # Scoped by the config's own `included:` (Sources and Tests) rather than a
  # narrower list — the framework must not rewrite a user's TERM either.
  # `match_kinds` must name BOTH `identifier` and `string`: the matched range
  # spans the `setenv` identifier and the `"TERM"` literal, and listing only
  # one rejects every match. Comments are excluded by their absence from the
  # list, so the prose that explains the rule does not trip it.
  #
  # What it cannot see: an indirected name, `let name = "TERM"` followed by
  # `setenv(name, …)`. `ProcessWideState.setEnvironment(_:to:)` in the tests is
  # one, and writes any name, but only inside an exit test, whose process no
  # other test shares. It and `ProcessWideState.seedDiscoveredHost(_:)` are the
  # only environment writes left in `Tests/`. The runtime backstop for the
  # indirected case is `ColorDepthDetectionTests`'s last test.
  process_terminal_environment_mutation:
    name: "Process TERM/COLORTERM mutation"
    message: >-
      Writing TERM or COLORTERM process-wide can latch the process colour depth
      at a fake value for every concurrently-rendering test. Pose the question
      on a dictionary instead: ColorDepth.detect(environment:).
    regex: '\b(un)?setenv\(\s*"(TERM|COLORTERM)"'
    match_kinds:
      - identifier
      - string
    severity: error

  # swift-testing runs every suite of every test target concurrently in ONE
  # process, so a value published process-wide is in force for every test
  # running at that moment, on every thread. `.serialized` orders a suite's own
  # tests and nothing else. Restoring the value afterwards leaves the window
  # open and does not undo the generation counter that every render cache
  # clears on. Two flakes on 2026-09-28 came from this:
  # `ANSIPrefixKnownWidthTests`' fuzz, measured under traits another suite had
  # moved, and `BackdropMemoTests`, whose cache a colours test on another
  # thread cleared between two frames.
  #
  # So a test writes process-wide state only inside an exit test
  # (`#expect(processExitsWith:)`), whose body runs in a child process that no
  # other test shares, and only through `ProcessWideState`. That type refuses
  # a write anywhere else: it records an issue and leaves the value alone.
  # This rule is the static half. It forbids the raw writes everywhere in
  # `Tests/` except the two `ProcessWideState` files. Every other test pins
  # the value for its own task (`TerminalWidthTraits.withTraits`,
  # `TerminalColors.withCurrent`, `ColorDepth.withCurrent`,
  # `TerminalHyperlink.withSupport`, `KittyGraphics.withSupport`) or poses the
  # question on arguments.
  #
  # What it matches:
  # - assignments to the values the render path reads process-wide, including
  #   through a member (`TerminalWidthTraits.current.skinTone = …`);
  # - the `TerminalClient` knobs whose didSets republish them;
  # - the `apply…()` functions that publish them;
  # - `publishProcessWide` named as a value;
  # - `StorageDiagnostics.report(` and `.reset(`, which move the latest
  #   failure and the count a test elsewhere may be reading as its own;
  # - any environment write, including `TerminalHost.seedDiscoveredHost(` and
  #   `.identify(`, which put the identified host into the environment where
  #   the `TerminalHost` detectors, `static let`s, freeze on first read.
  # `(?!=)` rather than `[^=]` after the `=`, so that `==` is not a match and
  # the match does not run into the next token, which may be a keyword
  # (`nil`) that `match_kinds` would reject.
  #
  # What it cannot see: a DEFAULT argument that publishes.
  # - `TerminalColorRefresher`'s `publish:` defaults to `publishProcessWide`.
  #   `TerminalColorLatePublicationTests` relies on that, inside its exit test.
  # - `RenderLoop`'s `publishTerminalColors:` has the same default, and so has
  #   every loop built through `HeadlessApp` or `AppRunner`. A test that feeds
  #   one of those a volunteered colour reply publishes the reply
  #   process-wide.
  # Tests that feed replies pass a recording closure (`RenderLoopHarness`,
  # `RunLoopFoldTests`). Nor can it see a report made from inside a storage
  # backend whose write failed. Those land in `StorageDiagnostics` from the
  # shared process all the time, which is harmless only because no test there
  # asserts that the latest failure, or the count, is its own. The tests that
  # do run in exit tests.
  #
  # What it deliberately leaves alone: state that is main-actor isolated and
  # published nowhere else, written and restored in one synchronous stretch.
  # `RenderCache.verifiesMeasureMemo`, `TerminalHost.startupIdentity` and
  # `StackGuard.cachedExtent` are like that. No other main-actor test can run
  # inside that stretch, and nothing off the main actor can read the value.
  # And `StorageDiagnostics.onFailure`: only `StorageFailureTests` installs a
  # handler, taking turns under `.serialized`, and each handler keeps only the
  # failures under its own test's directory or key.
  # And `SignalManagerTests`, which installs process-wide signal dispositions
  # and sends the process a real SIGWINCH and SIGTERM, `.serialized`: no other
  # test installs a `SignalManager`, so no other test has a handler for the
  # signal to reach. A test that installs one would share its signals.
  process_wide_write_in_tests:
    name: "Process-wide write in a test"
    message: >-
      Every test in the process reads this, on every thread, while it stays
      written. Pin it for this task (withTraits / withCurrent / withSupport),
      pose the question on arguments, or — if the publication itself is the
      subject — write it through ProcessWideState inside an exit test.
    included:
      - "Tests/.*\\.swift$"
    excluded:
      - "Tests/[^/]+/(TestHelpers/)?ProcessWideState\\.swift$"
    regex: '\b(TerminalWidthTraits\.current|TerminalColors\.current|ColorDepth\.(current|cap)|TerminalHyperlink\.isSupported|KittyGraphics\.is(Compression)?Supported|TerminalURLOpening\.isEnabled|TerminalClient\.(simulated|simulatedQuirks|hyperlinkSupport|graphicsSupport|graphicsCompressionSupport|urlOpeningSupport))(\.\w+)*\s*=(?!=)|\bTerminalClient\.apply\w+\(|\bTerminalColorRefresher\.publishProcessWide\b|\bStorageDiagnostics\.(report|reset)\(|\bTerminalHost\.(seedDiscoveredHost|identify)\(|\b(set|unset|put)env\('
    match_kinds:
      - identifier
    severity: error

  # The standard library's SPI (`_forEachField`, `_forEachFieldWithKeyPath`,
  # `_EachFieldOptions`, `_MetadataKind`, …) is declared only in its PRIVATE
  # module interface. swift.org toolchains ship that — every local gate here,
  # Linux, WASM — and Xcode's SDKs do not, so an SPI import builds everywhere
  # this repository is checked and fails in Xcode, where most apps are built.
  # It has shipped twice: Performance-profile §58 (EnvironmentProperty,
  # 2026-09-14) and its addendum (TypeWalk, 2026-09-28), each found only when a
  # push reached CI's Xcode lanes. `RuntimeFields` is the route to field
  # metadata that builds in Xcode.
  stdlib_spi_import:
    name: "Standard library SPI import"
    message: >-
      Xcode's SDKs ship Swift's public interface only, so an @_spi import of
      Swift fails to build in Xcode while every swift.org toolchain accepts it.
      For field metadata use RuntimeFields.
    regex: '@_spi\(\w+\)\s+import\s+Swift\b'
    match_kinds:
      - attribute.builtin
      - attribute.id
      - keyword
      - identifier
    severity: error

  # Every built-in view draws with the palette's roles, so a theme restyles all
  # of them; the ThemingGuide article's "What built-in controls draw with" lists
  # which role each control uses and the few colours that stay literal. This
  # flags a new colour literal in the framework's view sources: an RGB, hex,
  # HSL, HSB or CMYK constructor, a terminal slot spelled `.ansi(_:)`, a named
  # `Color.x` static, or a bright ANSI slot.
  #
  # How it is scoped, each part of which was measured with SwiftLint 0.63.2:
  # - `included` and `excluded` are regexes matched against the file's path,
  #   not globs; a brace glob such as `Sources/TUIkit/{Views,Styles}` matches
  #   nothing and silently switches the rule off.
  # - All of Sources/TUIkit, not a list of its directories, so a new directory
  #   is covered without anyone remembering to add it. Sources/TUIkitView too.
  #   TUIkitStyling is not covered: it is the colour vocabulary and the palettes
  #   themselves.
  # - `match_kinds: [identifier]` keeps it out of comments and string
  #   literals, where the framework's docs spell `.rgb(` freely.
  # - Whole files are excluded only where colours are content (the colour
  #   pickers and editors and their swatch sets, `AnyGradient`) or spelling and
  #   arithmetic (the opacity blend, the terminal colour query, the opacity and
  #   colour-effect modifiers, colour animation). A single line of arithmetic in
  #   a view, such as the scrollbar's step toward white or black, takes an
  #   inline `swiftlint:disable` with its reason, rather than excluding the view.
  #
  # What it cannot see: an implicit member such as `.red` or `.cyan` passed
  # where a `Color` is expected, which is spelled the same as any enum case of
  # that name. `.ansi(` is matched the same way in any file it covers, so a
  # `case .ansi(...)` over some other enum there would need an inline disable;
  # today the only such cases, the ANSI segments of a rendered line, are in the
  # opacity blend and modifier, which are excluded.
  framework_colour_literal:
    name: "Framework colour literal"
    message: >-
      A built-in view draws with a palette role, not a literal colour. See
      "What built-in controls draw with" in ThemingGuide.md; if the colour is
      content or arithmetic, not ink, disable this rule on that line and say why.
    included:
      - "Sources/TUIkit/.*\\.swift$"
      - "Sources/TUIkitView/.*\\.swift$"
    excluded:
      - "Sources/TUIkit/Views/(SwatchPalettes|ColorPickerPanel|ColorPicker|ToneCurveEditorPanel|GradientEditorPanel|ChannelCurveEditorPanel)\\.swift$"
      - "Sources/TUIkit/Rendering/(OpacityBlend|TerminalColorQuery)\\.swift$"
      - "Sources/TUIkit/Modifiers/(OpacityModifier|ColorEffectModifiers)\\.swift$"
      - "Sources/TUIkit/Styling/AnyGradient\\.swift$"
      - "Sources/TUIkitView/Animation/ColorAnimation\\.swift$"
    regex: '(\bColor)?\.(rgb|hex|hsl|hsb|cmyk|ansi)\(|\bColor\.(black|white|red|green|yellow|blue|magenta|cyan|gray|orange|pink|purple|brown|mint|teal|indigo|bright\w+)\b|\.bright(Black|Red|Green|Yellow|Blue|Magenta|Cyan|White)\b'
    match_kinds:
      - identifier
    severity: error
